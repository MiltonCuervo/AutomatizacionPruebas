serenity {
    take.screenshots = FOR_FAILURES
    restart.browser.for.each = scenario
    use.unique.browser = true
    test.root = co.edu.udea.certificacion.advshop.modulocompra
    console.colors = true
    driver.delay = 3000

    report {
        accessibility = true
    }
    requirement {
        types = "epic, feature"
    }
}

#headless.mode = true

webdriver {
  driver = chrome
  chrome.detach=true
  autodownload = true
  restart.for.each = scenario
  capabilities {
    browserName = "chrome"
    acceptInsecureCerts = true
    "goog:chromeOptions" {
                args = ["start-maximized", "test-type", "no-sandbox", "ignore-certificate-errors", "disable-popup-blocking", "disable-download-notification", "extensions-file-access-check", "incognito"]}
  }
}

chrome.switches = """--start-maximized;--test-type;--no-sandbox;--ignore-certificate-errors;
                   --disable-popup-blocking;--disable-default-apps;--disable-extensions-file-access-check;
                   --incognito;--disable-infobars,--disable-gpu;--remote-allow-origins=*"""

pages {
    advantageonlineshopping = "https://advantageonlineshopping.com/#/"
}